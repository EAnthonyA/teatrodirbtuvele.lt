name: Main CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Type-check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  docker-smoke-test:
    name: Docker build and smoke test
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t teatrodirbtuvele:ci .
      - name: Start and check the app
        run: |
          docker run -d --name app-test -p 3000:3000 teatrodirbtuvele:ci
          trap 'docker logs app-test; docker rm -f app-test' EXIT
          for attempt in $(seq 1 12); do
            if curl -fsS http://localhost:3000/api/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1
