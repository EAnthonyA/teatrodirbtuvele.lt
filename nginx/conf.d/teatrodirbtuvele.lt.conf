# This file is copied into the lazy-food nginx configuration during deployment.
server {
    listen 80;
    listen [::]:80;
    server_name teatrodirbtuvele.lt www.teatrodirbtuvele.lt;

    return 301 https://teatrodirbtuvele.lt$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.teatrodirbtuvele.lt;

    ssl_certificate /etc/nginx/conf.d/certs/teatrodirbtuvele.lt.pem;
    ssl_certificate_key /etc/nginx/conf.d/certs/teatrodirbtuvele.lt.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://teatrodirbtuvele.lt$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name teatrodirbtuvele.lt;

    ssl_certificate /etc/nginx/conf.d/certs/teatrodirbtuvele.lt.pem;
    ssl_certificate_key /etc/nginx/conf.d/certs/teatrodirbtuvele.lt.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://teatrodirbtuvele-next:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 12k;
    }
}
